<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Внутренний репозиторий скриптов</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1e1e2e; color: #cdd6f4; max-width: 600px; margin: 50px auto; padding: 20px; }
        h1 { color: #89b4fa; border-bottom: 2px solid #45475a; padding-bottom: 10px; font-size: 24px; }
        p { color: #a6adc8; font-size: 14px; }
        .script-list { margin-top: 20px; }
        .script-item { display: flex; justify-content: space-between; align-items: center; background: #313244; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .script-name { font-weight: bold; color: #f5e0dc; font-size: 16px; }
        .btn-install { background-color: #a6e3a1; color: #11111b; text-decoration: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; transition: background 0.2s; font-size: 14px; }
        .btn-install:hover { background-color: #94e2d5; }
    </style>
</head>
<body>

    <h1>Каталог автоматизации (Tampermonkey)</h1>
    <p>Нажмите на кнопку «Установить» напротив нужного скрипта. Расширение Tampermonkey автоматически перехватит запрос.</p>

    <div class="script-list">
        <!-- Скрипт 1 -->
        <div class="script-item">
            <span class="script-name">clue.user.js</span>
            <a class="btn-install" href="./clue.user.js">Установить</a>
        </div>

        <!-- Скрипт 2 -->
        <div class="script-item">
            <span class="script-name">autologin.user.js</span>
            <a class="btn-install" href="./autologin.user.js">Установить</a>
        </div>

        <!-- Скрипт 3 -->
        <div class="script-item">
            <span class="script-name">autotext.user.js</span>
            <a class="btn-install" href="./autotext.user.js">Установить</a>
        </div>
    </div>

</body>
</html>
